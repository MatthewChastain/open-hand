name: Feature request
description: Suggest a new feature or behavior change for Open Hand
labels: ["enhancement"]
body:
  - type: textarea
    id: the-idea
    attributes:
      label: What would you like Open Hand to do?
      description: Describe the behavior you'd like and the problem it solves.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or other approaches you've thought of.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I checked existing issues and pull requests for this idea
