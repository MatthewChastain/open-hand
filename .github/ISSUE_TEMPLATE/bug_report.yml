name: Bug report
description: Something in Open Hand is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. The more detail you provide, the easier it is to track down.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen instead?
    validations:
      required: true

  - type: input
    id: vs-version
    attributes:
      label: Vintage Story version
      description: e.g. 1.22.7
    validations:
      required: true

  - type: input
    id: mod-version
    attributes:
      label: Open Hand version
      description: e.g. 0.2.0 (visible in the mod list)
    validations:
      required: true

  - type: dropdown
    id: game-mode
    attributes:
      label: Where did it happen?
      options:
        - Single-player
        - Multiplayer client
        - Multiplayer dedicated server
    validations:
      required: true

  - type: textarea
    id: status-output
    attributes:
      label: `/openhand status` output
      description: Run `/openhand status` in chat and paste the result here.

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: |
        From VintagestoryData/Logs/ (client-main.log for most HUD issues).
        If Open Hand logged an "[openhand]" warning, include that too.

  - type: checkboxes
    id: conflicts
    attributes:
      label: Conflict check
      options:
        - label: Forever Empty is not installed
