name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  state-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet run --project tests/OpenHand.StateTests/OpenHand.StateTests.csproj -c Release
      - run: python3 -m json.tool src/OpenHand/modinfo.json > /dev/null
      # Keep the tag and the packaged version in lockstep.
      - name: Verify tag matches modinfo version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('src/OpenHand/modinfo.json'))['version'])")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match modinfo version v$VERSION" >&2
            exit 1
          fi

  # Builds the full mod (requires the game DLLs, hence the self-hosted runner
  # gated by the OPEN_HAND_SELF_HOSTED variable) and attaches the zip to the
  # GitHub release for the tag. The tag must match the modinfo version.
  build-and-release:
    if: ${{ vars.OPEN_HAND_SELF_HOSTED == 'true' }}
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - run: dotnet build OpenHand.sln -c Release
      - run: dotnet run --project tests/OpenHand.StateTests/OpenHand.StateTests.csproj -c Release
      - run: python3 scripts/package.py
      - name: Create or update the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes || true
          gh release upload "$GITHUB_REF_NAME" artifacts/openhand_*.zip --clobber
